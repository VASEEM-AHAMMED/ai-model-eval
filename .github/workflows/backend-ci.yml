name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  install_dependencies:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Python 3.13
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      # Install dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

  lint:
    runs-on: ubuntu-latest
    needs: install_dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run linting
        run: |
          source venv/bin/activate
          pip install pylint
          pylint backend/

  test:
    runs-on: ubuntu-latest
    needs: install_dependencies
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run tests
        run: |
          source venv/bin/activate
          pip install pytest
          pytest tests/  # Assuming your tests are inside the "tests" folder

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'  # Only deploy from the main branch
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server (example step)
        run: |
          echo "Deploying the application"
          # Add deployment steps here (e.g., SSH to server, pull the code, restart services, etc.)
