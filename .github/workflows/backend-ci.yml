name: Backend CI/CD Pipeline

# Trigger the workflow on specific events
on:
  push:
    branches:
      - dev  # Trigger on push to dev branch
  pull_request:
    branches:
      - dev  # Trigger on pull requests targeting the dev branch

jobs:
  build:
    runs-on: ubuntu-latest  # Run on the latest Ubuntu image

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2  # Checkout the repository so we can work with it

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v2  # Set up Python version for the project
        with:
          python-version: '3.9'  # Specify the Python version you are using (change if necessary)

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m venv venv  # Create a virtual environment
          source venv/bin/activate  # Activate the virtual environment
          pip install -r requirements.txt  # Install dependencies from requirements.txt

      # Step 4: Run tests
      - name: Run tests
        run: |
          source venv/bin/activate  # Activate the virtual environment again in this step
          pytest  # Run your tests (use 'pytest' or your testing tool)

      # Optional Step: Deploy to Production (If applicable)
      - name: Deploy to Production (Optional)
        run: |
          echo "Add your deployment steps here."  # This step is optional, used for deployment.
