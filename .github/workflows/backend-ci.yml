name: Backend CI

on:
  push:
    branches:
      - dev  # or main, depending on your branch
  pull_request:
    branches:
      - dev  # or main, depending on your branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Create virtual environment
      run: |
        python -m venv backend/venv  # This creates the virtual environment inside the 'backend' folder
        source backend/venv/bin/activate  # Activating the virtual environment in 'backend'

    - name: Install dependencies
      run: |
        source backend/venv/bin/activate  # Activating the virtual environment in 'backend'
        pip install -r backend/requirements.txt  # Make sure the correct path to requirements.txt is provided

    - name: Run tests
      run: |
        source backend/venv/bin/activate  # Activating the virtual environment in 'backend'
        pytest  # or your testing command
